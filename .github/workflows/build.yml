name: Build and Package ZCombine

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller 
        pip install -r requirements.txt

    # Step 1: Build the main application (zcm.exe)
    # Bundle the template and the icon file so they can be found at runtime.
    - name: Build Main Application (zcm.exe)
      run: |
        pyinstaller --onefile --name zcm --icon icon.ico --collect-all customtkinter --add-data "zcm-template.bat;." --add-data "icon.ico;." zcm.py

    # Step 2: Build the Installer (zcm-setup.exe)
    # Bundle the compiled zcm.exe, the uninstall.bat, and the template for installation.
    - name: Build Setup Installer (zcm-setup.exe)
      run: |
        pyinstaller --onefile --name zcm-setup --icon icon.ico --add-data "dist\zcm.exe;." --add-data "uninstall.bat;." --add-data "zcm-template.bat;." installer.py

    # Step 3: Upload the installer as a workflow artifact (for testing)
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZCombine-Installer
        path: dist/zcm-setup.exe

    # Step 4: Attach the installer to the GitHub Release (if triggered by a release)
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/zcm-setup.exe